syntax = "proto3";

package webhmi;

// Payload protobuf definitions for `protocol.md`.
// - Auth (0x0000): payload stays raw binary (not protobuf).
// - Other msg_id: payload uses protobuf messages defined in this file.

enum FilterType {
  Peak = 0;
  LowShelf = 1;
  HighShelf = 2;
  LowPass = 3;
  HighPass = 4;
  BandPass = 5;
  Notch = 6;
}

enum InputSelect {
  BT = 0;
  UDISK = 1;
  SPDIF = 2;
  COA = 3;
  USB = 4;
  AUX1 = 6;
  AUX2 = 7;
}

enum FbxMode {
  Off = 0;
  Level1 = 1;
  Level2 = 2;
  Level3 = 3;
  Level4 = 4;
  Level5 = 5;
  Level6 = 6;
}

enum EqTarget {
  MUSIC = 0;
  MIC_A = 1;
  MIC_B = 2;
  REVERB = 3;
  ECHO = 4;
  MAIN_OUTPUT = 5;
  SUB_OUTPUT = 6;
  CENTER = 7;
  SURROUND = 8;
}

enum DbSection {
  SEC_SYSTEM = 0;
  SEC_MUSIC = 1;
  SEC_MIC = 2;
  SEC_REVERB = 3;
  SEC_ECHO = 4;
  SEC_MAIN_OUTPUT = 5;
  SEC_SUB_OUTPUT = 6;
  SEC_CENTER = 7;
  SEC_SURROUND = 8;
}

enum OutputControlMode {
  OUTPUT_CONTROL_AUTO = 0;
  OUTPUT_CONTROL_MANUAL = 1;
}

enum OutputSceneMode {
  OUTPUT_SCENE_SING = 0;
  OUTPUT_SCENE_DANCE = 1;
}

// ======== Full DB schema (GetDbResponse payload) ========

message EqPoint {
  optional uint32 index = 1;
  optional FilterType type = 2;
  optional uint32 freq = 3; // Hz
  optional float gain = 4;
  optional float q = 5;

  optional FilterType defaultType = 6;
  optional uint32 defaultFreq = 7; // Hz
  optional float defaultGain = 8;
  optional float defaultQ = 9;
}

message Eq {
  repeated EqPoint point = 1;
  optional bool bypass = 2;

  // UI helper lists (enum names are used in JSON examples).
  repeated FilterType highPassTypeList = 3;
  repeated FilterType typeList = 4;

  // Note: `protocol.md` example uses `lowPasstypeList` (typo). The intended field is `lowPassTypeList`.
  repeated FilterType lowPassTypeList = 5;

  optional uint32 minFreq = 6; // Hz
  optional uint32 maxFreq = 7; // Hz
  optional uint32 stepFreq = 8; // Hz
  optional float minGain = 9;
  optional float maxGain = 10;
  optional float stepGain = 11;
  optional float minQ = 12;
  optional float maxQ = 13;
  optional float stepQ = 14;
}

message NoiseGate {
  optional float gate = 1;
  optional float minGate = 2;
  optional float maxGate = 3;
  optional float stepGate = 4;

  optional uint32 frameTime = 5;
  optional uint32 minFrameTime = 6;
  optional uint32 maxFrameTime = 7;
  optional uint32 stepFrameTime = 8;

  optional uint32 atkTime = 9;
  optional uint32 minAtkTime = 10;
  optional uint32 maxAtkTime = 11;
  optional uint32 stepAtkTime = 12;

  optional uint32 relTime = 13;
  optional uint32 minRelTime = 14;
  optional uint32 maxRelTime = 15;
  optional uint32 stepRelTime = 16;
}

message Compressor {
  optional float threshold = 1;
  optional float minThreshold = 2;
  optional float maxThreshold = 3;
  optional float stepThreshold = 4;

  optional uint32 ratio = 5;
  optional uint32 minRatio = 6;
  optional uint32 maxRatio = 7;
  optional uint32 stepRatio = 8;

  optional uint32 attack = 9;
  optional uint32 minAttack = 10;
  optional uint32 maxAttack = 11;
  optional uint32 stepAttack = 12;

  optional uint32 release = 13;
  optional uint32 minRelease = 14;
  optional uint32 maxRelease = 15;
  optional uint32 stepRelease = 16;

  optional bool bypass = 17;
}

message SystemDb {
  optional string bleName = 1;
  optional bool panelLock = 2;
  optional bool mute = 3;

  optional uint32 musicVolume = 4;
  optional uint32 minMusicVolume = 5;
  optional uint32 maxMusicVolume = 6;
  optional uint32 stepMusicVolume = 7;

  optional uint32 micVolume = 8;
  optional uint32 minMicVolume = 9;
  optional uint32 maxMicVolume = 10;
  optional uint32 stepMicVolume = 11;

  optional uint32 effectVolume = 12;
  optional uint32 minEffectVolume = 13;
  optional uint32 maxEffectVolume = 14;
  optional uint32 stepEffectVolume = 15;

  repeated string modeList = 16;
  optional uint32 currentModeIndex = 17;

  optional OutputControlMode controlMode = 18;
  optional OutputSceneMode sceneMode = 19;

  optional int32 micDetectionThreshold = 20;
  optional int32 minMicDetectionThreshold = 21;
  optional int32 maxMicDetectionThreshold = 22;
  optional uint32 stepMicDetectionThreshold = 23;

  optional uint32 micDetectionTime = 24;
  optional uint32 minMicDetectionTime = 25;
  optional uint32 maxMicDetectionTime = 26;
  optional uint32 stepMicDetectionTime = 27;

  optional bool useDefaultVolume = 28;

  optional uint32 musicDefaultVolume = 29;
  optional uint32 minMusicDefaultVolume = 30;
  optional uint32 maxMusicDefaultVolume = 31;
  optional uint32 stepMusicDefaultVolume = 32;

  optional uint32 micDefaultVolume = 33;
  optional uint32 minMicDefaultVolume = 34;
  optional uint32 maxMicDefaultVolume = 35;
  optional uint32 stepMicDefaultVolume = 36;

  optional uint32 effectDefaultVolume = 37;
  optional uint32 minEffectDefaultVolume = 38;
  optional uint32 maxEffectDefaultVolume = 39;
  optional uint32 stepEffectDefaultVolume = 40;

  optional uint32 musicMaxVolume = 41;
  optional uint32 minMusicMaxVolume = 42;
  optional uint32 maxMusicMaxVolume = 43;
  optional uint32 stepMusicMaxVolume = 44;

  optional uint32 micMaxVolume = 45;
  optional uint32 minMicMaxVolume = 46;
  optional uint32 maxMicMaxVolume = 47;
  optional uint32 stepMicMaxVolume = 48;

  optional uint32 effectMaxVolume = 49;
  optional uint32 minEffectMaxVolume = 50;
  optional uint32 maxEffectMaxVolume = 51;
  optional uint32 stepEffectMaxVolume = 52;
}

message MusicDb {
  optional Eq eq = 1;

  optional InputSelect inputSelect = 2;
  repeated InputSelect inputSelectList = 3;

  optional int32 inputGain = 4;
  optional int32 minInputGain = 5;
  optional int32 maxInputGain = 6;
  optional uint32 stepInputGain = 7;

  optional int32 btGain = 8;
  optional int32 minBtGain = 9;
  optional int32 maxBtGain = 10;
  optional uint32 stepBtGain = 11;

  optional int32 udiskGain = 12;
  optional int32 minUdiskGain = 13;
  optional int32 maxUdiskGain = 14;
  optional uint32 stepUdiskGain = 15;

  optional float musicPitch = 16;
  optional float minMusicPitch = 17;
  optional float maxMusicPitch = 18;
  optional float stepMusicPitch = 19;

  optional float bass = 20;
  optional float minBass = 21;
  optional float maxBass = 22;
  optional float stepBass = 23;

  optional float mid = 24;
  optional float minMid = 25;
  optional float maxMid = 26;
  optional float stepMid = 27;

  optional uint32 midFreq = 28; // Hz
  optional uint32 minMidFreq = 29; // Hz
  optional uint32 maxMidFreq = 30; // Hz
  optional uint32 stepMidFreq = 31; // Hz

  optional float treble = 32;
  optional float minTreble = 33;
  optional float maxTreble = 34;
  optional float stepTreble = 35;

  optional NoiseGate noise = 36;
}

message MicEqDb {
  optional Eq eq = 1;
}

message MicDb {
  optional MicEqDb micAEq = 1;
  optional MicEqDb micBEq = 2;
  optional bool micEqJointDebugging = 3;

  optional FbxMode micFBX = 4;
  repeated FbxMode fbxModeList = 5;

  optional uint32 micAVolume = 6;
  optional uint32 minMicAVolume = 7;
  optional uint32 maxMicAVolume = 8;
  optional uint32 stepMicAVolume = 9;

  optional uint32 micBVolume = 10;
  optional uint32 minMicBVolume = 11;
  optional uint32 maxMicBVolume = 12;
  optional uint32 stepMicBVolume = 13;

  optional float bass = 14;
  optional float minBass = 15;
  optional float maxBass = 16;
  optional float stepBass = 17;

  optional float mid = 18;
  optional float minMid = 19;
  optional float maxMid = 20;
  optional float stepMid = 21;

  optional uint32 midFreq = 22; // Hz
  optional uint32 minMidFreq = 23; // Hz
  optional uint32 maxMidFreq = 24; // Hz
  optional uint32 stepMidFreq = 25; // Hz

  optional float treble = 26;
  optional float minTreble = 27;
  optional float maxTreble = 28;
  optional float stepTreble = 29;

  optional NoiseGate noise = 30;
  optional Compressor compressor = 31;
}

message ReverbDb {
  optional Eq eq = 1;

  optional uint32 reverbLevel = 2;
  optional bool reverbLevelPhaseInversion = 3;
  optional uint32 minReverbLevel = 4;
  optional uint32 maxReverbLevel = 5;
  optional uint32 stepReverbLevel = 6;

  optional uint32 micDirectLevel = 7;
  optional bool micDirectLevelPhaseInversion = 8;
  optional uint32 minMicDirectLevel = 9;
  optional uint32 maxMicDirectLevel = 10;
  optional uint32 stepMicDirectLevel = 11;

  optional uint32 reverbPredelay = 12;
  optional uint32 minReverbPredelay = 13;
  optional uint32 maxReverbPredelay = 14;
  optional uint32 stepReverbPredelay = 15;

  optional uint32 reverbDecay = 16;
  optional uint32 minReverbDecay = 17;
  optional uint32 maxReverbDecay = 18;
  optional uint32 stepReverbDecay = 19;
}

message EchoDb {
  optional Eq eq = 1;

  optional uint32 echoLevel = 2;
  optional bool echoLevelPhaseInversion = 3;
  optional uint32 minEchoLevel = 4;
  optional uint32 maxEchoLevel = 5;
  optional uint32 stepEchoLevel = 6;

  optional uint32 micDirectLevel = 7;
  optional bool micDirectLevelPhaseInversion = 8;
  optional uint32 minMicDirectLevel = 9;
  optional uint32 maxMicDirectLevel = 10;
  optional uint32 stepMicDirectLevel = 11;

  optional uint32 echoPredelay = 12;
  optional uint32 minEchoPredelay = 13;
  optional uint32 maxEchoPredelay = 14;
  optional uint32 stepEchoPredelay = 15;

  optional uint32 echoDelayTime = 16;
  optional uint32 minEchoDelayTime = 17;
  optional uint32 maxEchoDelayTime = 18;
  optional uint32 stepEchoDelayTime = 19;

  optional uint32 echoRepeat = 20;
  optional uint32 minEchoRepeat = 21;
  optional uint32 maxEchoRepeat = 22;
  optional uint32 stepEchoRepeat = 23;

  optional uint32 echoRightPredelay = 24;
  optional uint32 minEchoRightPredelay = 25;
  optional uint32 maxEchoRightPredelay = 26;
  optional uint32 stepEchoRightPredelay = 27;

  optional int32 echoRightDelay = 28;
  optional int32 minEchoRightDelay = 29;
  optional int32 maxEchoRightDelay = 30;
  optional uint32 stepEchoRightDelay = 31;
}

message StereoOutput {
  optional float leftChannelVolume = 1;
  optional bool leftChannelVolumePhaseInversion = 2;
  optional float minLeftChannelVolume = 3;
  optional float maxLeftChannelVolume = 4;
  optional float stepLeftChannelVolume = 5;

  optional float rightChannelVolume = 6;
  optional bool rightChannelVolumePhaseInversion = 7;
  optional float minRightChannelVolume = 8;
  optional float maxRightChannelVolume = 9;
  optional float stepRightChannelVolume = 10;

  optional float leftDelay = 11;
  optional float minLeftDelay = 12;
  optional float maxLeftDelay = 13;
  optional float stepLeftDelay = 14;

  optional float rightDelay = 15;
  optional float minRightDelay = 16;
  optional float maxRightDelay = 17;
  optional float stepRightDelay = 18;

  optional bool leftMute = 19;
  optional bool rightMute = 20;
}

message MonoOutput {
  optional float volume = 1;
  optional bool volumePhaseInversion = 2;
  optional float minVolume = 3;
  optional float maxVolume = 4;
  optional float stepVolume = 5;

  optional float delay = 6;
  optional float minDelay = 7;
  optional float maxDelay = 8;
  optional float stepDelay = 9;

  optional bool mute = 10;
}

message Mixer {
  optional uint32 micDirectLevel = 1;
  optional bool micDirectLevelPhaseInversion = 2;
  optional uint32 minMicDirectLevel = 3;
  optional uint32 maxMicDirectLevel = 4;
  optional uint32 stepMicDirectLevel = 5;

  optional uint32 musicLevel = 6;
  optional bool musicLevelPhaseInversion = 7;
  optional uint32 minMusicLevel = 8;
  optional uint32 maxMusicLevel = 9;
  optional uint32 stepMusicLevel = 10;

  optional uint32 reverbLevel = 11;
  optional bool reverbLevelPhaseInversion = 12;
  optional uint32 minReverbLevel = 13;
  optional uint32 maxReverbLevel = 14;
  optional uint32 stepReverbLevel = 15;

  optional uint32 echoLevel = 16;
  optional bool echoLevelPhaseInversion = 17;
  optional uint32 minEchoLevel = 18;
  optional uint32 maxEchoLevel = 19;
  optional uint32 stepEchoLevel = 20;
}

message MainOutputDb {
  optional Eq singEq = 1;
  optional Mixer singMixer = 2;
  optional Eq danceEq = 3;
  optional Mixer danceMixer = 4;
  optional StereoOutput output = 5;
  optional Compressor compressor = 6;
}

message SubOutputDb {
  optional Eq singEq = 1;
  optional Mixer singMixer = 2;
  optional Eq danceEq = 3;
  optional Mixer danceMixer = 4;
  optional MonoOutput output = 5;
  optional Compressor compressor = 6;
}

message CenterDb {
  optional Eq singEq = 1;
  optional Mixer singMixer = 2;
  optional Eq danceEq = 3;
  optional Mixer danceMixer = 4;
  optional MonoOutput output = 5;
  optional Compressor compressor = 6;
}

message SurroundDb {
  optional Eq singEq = 1;
  optional Mixer singMixer = 2;
  optional Eq danceEq = 3;
  optional Mixer danceMixer = 4;
  optional StereoOutput output = 5;
  optional Compressor compressor = 6;
}

message DeviceDb {
  optional SystemDb system = 1;
  optional MusicDb music = 2;
  optional MicDb mic = 3;
  optional ReverbDb reverb = 4;
  optional EchoDb echo = 5;
  optional MainOutputDb mainOutput = 6;
  optional SubOutputDb subOutput = 7;
  optional CenterDb center = 8;
  optional SurroundDb surround = 9;
}

message GetDbRequest {
  optional DbSection section = 1;
}

message GetDbResponse {
  optional string deviceId = 1;
  optional string firmwareVersion = 2;
  optional DbSection section = 3;

  oneof payload {
    SystemDb system = 4;
    MusicDb music = 5;
    MicDb mic = 6;
    ReverbDb reverb = 7;
    EchoDb echo = 8;
    MainOutputDb mainOutput = 9;
    SubOutputDb subOutput = 10;
    CenterDb center = 11;
    SurroundDb surround = 12;
  }
}

message DeviceConfig {
  optional string deviceId = 1;
  optional string firmwareVersion = 2;
  optional DeviceDb db = 3;
}

// ======== Patch requests (Set*) ========

message EqPointPatch {
  optional uint32 index = 1;
  optional FilterType type = 2;
  optional uint32 freq = 3; // Hz
  optional float gain = 4;
  optional float q = 5;
}

message EqPatch {
  optional EqTarget target = 1;
  optional bool bypass = 2;
  optional OutputSceneMode sceneMode = 3;
  repeated EqPointPatch point = 4;
}

message SetEqRequest {
  repeated EqPatch eq = 1;
}

message NoiseGatePatch {
  optional float gate = 1;
  optional uint32 frameTime = 2;
  optional uint32 atkTime = 3;
  optional uint32 relTime = 4;
}

message CompressorPatch {
  optional float threshold = 1;
  optional uint32 ratio = 2;
  optional uint32 attack = 3;
  optional uint32 release = 4;
  optional bool bypass = 5;
}

message StereoOutputPatch {
  optional float leftChannelVolume = 1;
  optional float rightChannelVolume = 2;
  optional float leftDelay = 3;
  optional float rightDelay = 4;
  optional bool leftMute = 5;
  optional bool rightMute = 6;

  optional bool leftChannelVolumePhaseInversion = 7;
  optional bool rightChannelVolumePhaseInversion = 8;
}

message MonoOutputPatch {
  optional float volume = 1;
  optional float delay = 2;
  optional bool mute = 3;

  optional bool volumePhaseInversion = 4;
}

message MixerPatch {
  optional uint32 micDirectLevel = 1;
  optional uint32 musicLevel = 2;
  optional uint32 reverbLevel = 3;
  optional uint32 echoLevel = 4;

  optional bool micDirectLevelPhaseInversion = 5;
  optional bool musicLevelPhaseInversion = 6;
  optional bool reverbLevelPhaseInversion = 7;
  optional bool echoLevelPhaseInversion = 8;
}

message SetSystemRequest {
  optional string bleName = 1;
  optional bool panelLock = 2;
  optional bool mute = 3;

  optional uint32 musicVolume = 4;
  optional uint32 micVolume = 5;
  optional uint32 effectVolume = 6;

  repeated string modeList = 7;
  optional uint32 currentModeIndex = 8;

  optional OutputControlMode controlMode = 9;
  optional OutputSceneMode sceneMode = 10;

  optional int32 micDetectionThreshold = 11;
  optional uint32 micDetectionTime = 12;

  optional bool useDefaultVolume = 13;

  optional uint32 musicDefaultVolume = 14;
  optional uint32 micDefaultVolume = 15;
  optional uint32 effectDefaultVolume = 16;

  optional uint32 musicMaxVolume = 17;
  optional uint32 micMaxVolume = 18;
  optional uint32 effectMaxVolume = 19;
}

message SetMusicRequest {
  optional int32 inputGain = 1;
  optional int32 btGain = 2;
  optional int32 udiskGain = 3;
  optional float musicPitch = 4;
  optional InputSelect inputSelect = 5;

  optional float bass = 6;
  optional float mid = 7;
  optional uint32 midFreq = 8; // Hz
  optional float treble = 9;

  optional NoiseGatePatch noise = 10;
}

message SetMicRequest {
  optional bool micEqJointDebugging = 1;
  optional uint32 micAVolume = 2;
  optional uint32 micBVolume = 3;
  optional FbxMode micFBX = 4;

  optional float bass = 5;
  optional float mid = 6;
  optional uint32 midFreq = 7; // Hz
  optional float treble = 8;

  optional NoiseGatePatch noise = 9;
  optional CompressorPatch compressor = 10;
}

message SetReverbRequest {
  optional uint32 reverbLevel = 1;
  optional uint32 micDirectLevel = 2;
  optional uint32 reverbPredelay = 3;
  optional uint32 reverbDecay = 4;

  optional bool reverbLevelPhaseInversion = 5;
  optional bool micDirectLevelPhaseInversion = 6;
}

message SetEchoRequest {
  optional uint32 echoLevel = 1;
  optional uint32 micDirectLevel = 2;
  optional uint32 echoPredelay = 3;
  optional uint32 echoDelayTime = 4;
  optional uint32 echoRepeat = 5;
  optional uint32 echoRightPredelay = 6;
  optional int32 echoRightDelay = 7;

  optional bool echoLevelPhaseInversion = 8;
  optional bool micDirectLevelPhaseInversion = 9;
}

message SetMainOutputRequest {
  optional MixerPatch singMixer = 1;
  optional MixerPatch danceMixer = 2;
  optional StereoOutputPatch output = 3;
  optional CompressorPatch compressor = 4;
}

message SetSubOutputRequest {
  optional MixerPatch singMixer = 1;
  optional MixerPatch danceMixer = 2;
  optional MonoOutputPatch output = 3;
  optional CompressorPatch compressor = 4;
}

// Protocol.md currently has no dedicated msg_id for these, but the DB contains these sections.
message SetCenterRequest {
  optional MixerPatch singMixer = 1;
  optional MixerPatch danceMixer = 2;
  optional MonoOutputPatch output = 3;
  optional CompressorPatch compressor = 4;
}

message SetSurroundRequest {
  optional MixerPatch singMixer = 1;
  optional MixerPatch danceMixer = 2;
  optional StereoOutputPatch output = 3;
  optional CompressorPatch compressor = 4;
}

message SwitchCurrentModeRequest {
  optional uint32 currentModeIndex = 1;
}

message SwitchCurrentModeResponse {
  optional uint32 currentModeIndex = 1;
}

message SaveModeRequest {
  optional uint32 currentModeIndex = 1;
}

message ResetEqRequest {
  optional EqTarget target = 1;
  repeated uint32 index = 2; // empty = reset all points
  optional OutputSceneMode sceneMode = 3;
}
