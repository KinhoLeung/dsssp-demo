syntax = "proto3";

package webhmi;

// Payload protobuf definitions for `protocol.md`.
// - Auth (0x0000): payload stays raw binary (not protobuf).
// - Other msg_id: payload uses protobuf messages defined in this file.

enum FilterType {
  Peak = 0;
  LowShelf = 1;
  HighShelf = 2;
  LowPass = 3;
  HighPass = 4;
  BandPass = 5;
  Notch = 6;
}

enum InputSelect {
  BT = 0;
  UDISK = 1;
  SPDIF = 2;
  COA = 3;
  USB = 4;
  AUX1 = 6;
  AUX2 = 7;
}

enum FbxMode {
  Off = 0;
  Level1 = 1;
  Level2 = 2;
  Level3 = 3;
  Level4 = 4;
  Level5 = 5;
  Level6 = 6;
}

enum EqTarget {
  MUSIC = 0;
  MIC_A = 1;
  MIC_B = 2;
  REVERB = 3;
  ECHO = 4;
  MAIN_OUTPUT = 5;
  SUB_OUTPUT = 6;
  CENTER = 7;
  SURROUND = 8;
}

enum DbSection {
  SEC_SYSTEM = 0;
  SEC_MUSIC = 1;
  SEC_MIC = 2;
  SEC_REVERB = 3;
  SEC_ECHO = 4;
  SEC_MAIN_OUTPUT = 5;
  SEC_SUB_OUTPUT = 6;
  SEC_CENTER = 7;
  SEC_SURROUND = 8;
}

// ======== Full DB schema (GetDbResponse payload) ========

message EqPoint {
  optional uint32 index = 1;
  optional FilterType type = 2;
  optional uint32 freq = 3; // Hz
  optional float gain = 4;
  optional float q = 5;

  optional FilterType defaultType = 6;
  optional uint32 defaultFreq = 7; // Hz
  optional float defaultGain = 8;
  optional float defaultQ = 9;
}

message Eq {
  repeated EqPoint point = 1;
  optional bool bypass = 2;

  // UI helper lists (enum names are used in JSON examples).
  repeated FilterType highPassTypeList = 3;
  repeated FilterType typeList = 4;

  // Note: `protocol.md` example uses `lowPasstypeList` (typo). The intended field is `lowPassTypeList`.
  repeated FilterType lowPassTypeList = 5;

  optional uint32 minFreq = 6; // Hz
  optional uint32 maxFreq = 7; // Hz
  optional uint32 stepFreq = 8; // Hz
  optional float minGain = 9;
  optional float maxGain = 10;
  optional float stepGain = 11;
  optional float minQ = 12;
  optional float maxQ = 13;
  optional float stepQ = 14;
}

message NoiseGate {
  optional float gate = 1;
  optional uint32 frameTime = 2;
  optional uint32 atkTime = 3;
  optional uint32 relTime = 4;

  optional float minGate = 5;
  optional float maxGate = 6;
  optional float stepGate = 7;
  optional uint32 minFrameTime = 8;
  optional uint32 maxFrameTime = 9;
  optional uint32 stepFrameTime = 10;
  optional uint32 minAtkTime = 11;
  optional uint32 maxAtkTime = 12;
  optional uint32 stepAtkTime = 13;
  optional uint32 minRelTime = 14;
  optional uint32 maxRelTime = 15;
  optional uint32 stepRelTime = 16;
}

message Compressor {
  optional float threshold = 1;
  optional uint32 ratio = 2;
  optional uint32 attack = 3;
  optional uint32 release = 4;
  optional bool bypass = 5;

  optional float minThreshold = 6;
  optional float maxThreshold = 7;
  optional float stepThreshold = 8;
  optional uint32 minRatio = 9;
  optional uint32 maxRatio = 10;
  optional uint32 stepRatio = 11;
  optional uint32 minAttack = 12;
  optional uint32 maxAttack = 13;
  optional uint32 stepAttack = 14;
  optional uint32 minRelease = 15;
  optional uint32 maxRelease = 16;
  optional uint32 stepRelease = 17;
}

message SystemDb {
  optional string bleName = 1;
  optional bool panelLock = 2;
  optional bool mute = 3;

  optional uint32 musicMaxVolume = 4;
  optional uint32 micMaxVolume = 5;
  optional uint32 effectMaxVolume = 6;

  optional uint32 musicDefaultVolume = 7;
  optional uint32 micDefaultVolume = 8;
  optional uint32 effectDefaultVolume = 9;

  optional bool useDefaultVolume = 10;

  repeated string modeList = 11;
  optional uint32 currentModeIndex = 12;

  optional uint32 musicVolume = 13;
  optional uint32 micVolume = 14;
  optional uint32 effectVolume = 15;

  optional uint32 minMusicMaxVolume = 16;
  optional uint32 maxMusicMaxVolume = 17;
  optional uint32 stepMusicMaxVolume = 18;
  optional uint32 minMicMaxVolume = 19;
  optional uint32 maxMicMaxVolume = 20;
  optional uint32 stepMicMaxVolume = 21;
  optional uint32 minEffectMaxVolume = 22;
  optional uint32 maxEffectMaxVolume = 23;
  optional uint32 stepEffectMaxVolume = 24;
  optional uint32 minMusicDefaultVolume = 25;
  optional uint32 maxMusicDefaultVolume = 26;
  optional uint32 stepMusicDefaultVolume = 27;
  optional uint32 minMicDefaultVolume = 28;
  optional uint32 maxMicDefaultVolume = 29;
  optional uint32 stepMicDefaultVolume = 30;
  optional uint32 minEffectDefaultVolume = 31;
  optional uint32 maxEffectDefaultVolume = 32;
  optional uint32 stepEffectDefaultVolume = 33;
  optional uint32 minMusicVolume = 34;
  optional uint32 maxMusicVolume = 35;
  optional uint32 stepMusicVolume = 36;
  optional uint32 minMicVolume = 37;
  optional uint32 maxMicVolume = 38;
  optional uint32 stepMicVolume = 39;
  optional uint32 minEffectVolume = 40;
  optional uint32 maxEffectVolume = 41;
  optional uint32 stepEffectVolume = 42;
}

message MusicDb {
  optional Eq eq = 1;

  optional int32 inputGain = 2;
  optional int32 btGain = 3;
  optional int32 udiskGain = 4;
  optional float musicPitch = 5;
  optional InputSelect inputSelect = 6;

  optional float bass = 7;
  optional float mid = 8;
  optional uint32 midFreq = 9; // Hz
  optional float treble = 10;

  optional NoiseGate noise = 11;
  repeated InputSelect inputSelectList = 12;

  optional int32 minInputGain = 13;
  optional int32 maxInputGain = 14;
  optional uint32 stepInputGain = 15;
  optional int32 minBtGain = 16;
  optional int32 maxBtGain = 17;
  optional uint32 stepBtGain = 18;
  optional int32 minUdiskGain = 19;
  optional int32 maxUdiskGain = 20;
  optional uint32 stepUdiskGain = 21;
  optional float minMusicPitch = 22;
  optional float maxMusicPitch = 23;
  optional float stepMusicPitch = 24;
  optional float minBass = 25;
  optional float maxBass = 26;
  optional float stepBass = 27;
  optional float minMid = 28;
  optional float maxMid = 29;
  optional float stepMid = 30;
  optional uint32 minMidFreq = 31; // Hz
  optional uint32 maxMidFreq = 32; // Hz
  optional uint32 stepMidFreq = 33; // Hz
  optional float minTreble = 34;
  optional float maxTreble = 35;
  optional float stepTreble = 36;
}

message MicEqDb {
  optional Eq eq = 1;
}

message MicDb {
  optional MicEqDb micAEq = 1;
  optional MicEqDb micBEq = 2;
  optional bool micEqJointDebugging = 3;

  optional uint32 micAVolume = 4;
  optional uint32 micBVolume = 5;
  optional FbxMode micFBX = 6;

  optional float bass = 7;
  optional float mid = 8;
  optional uint32 midFreq = 9; // Hz
  optional float treble = 10;

  optional NoiseGate noise = 11;
  optional Compressor compressor = 12;
  repeated FbxMode fbxModeList = 13;

  optional uint32 minMicAVolume = 14;
  optional uint32 maxMicAVolume = 15;
  optional uint32 stepMicAVolume = 16;
  optional uint32 minMicBVolume = 17;
  optional uint32 maxMicBVolume = 18;
  optional uint32 stepMicBVolume = 19;
  optional float minBass = 20;
  optional float maxBass = 21;
  optional float stepBass = 22;
  optional float minMid = 23;
  optional float maxMid = 24;
  optional float stepMid = 25;
  optional uint32 minMidFreq = 26; // Hz
  optional uint32 maxMidFreq = 27; // Hz
  optional uint32 stepMidFreq = 28; // Hz
  optional float minTreble = 29;
  optional float maxTreble = 30;
  optional float stepTreble = 31;
}

message ReverbDb {
  optional Eq eq = 1;

  optional uint32 reverbLevel = 2;
  optional uint32 micDirectLevel = 3;
  optional uint32 reverbPredelay = 4;
  optional uint32 reverbDecay = 5;

  optional bool reverbLevelPhaseInversion = 6;
  optional bool micDirectLevelPhaseInversion = 7;

  optional uint32 minReverbLevel = 8;
  optional uint32 maxReverbLevel = 9;
  optional uint32 stepReverbLevel = 10;
  optional uint32 minMicDirectLevel = 11;
  optional uint32 maxMicDirectLevel = 12;
  optional uint32 stepMicDirectLevel = 13;
  optional uint32 minReverbPredelay = 14;
  optional uint32 maxReverbPredelay = 15;
  optional uint32 stepReverbPredelay = 16;
  optional uint32 minReverbDecay = 17;
  optional uint32 maxReverbDecay = 18;
  optional uint32 stepReverbDecay = 19;
}

message EchoDb {
  optional Eq eq = 1;

  optional uint32 echoLevel = 2;
  optional uint32 micDirectLevel = 3;
  optional uint32 echoPredelay = 4;
  optional uint32 echoDelayTime = 5;
  optional uint32 echoRepeat = 6;
  optional uint32 echoRightPredelay = 7;
  optional int32 echoRightDelay = 8;

  optional bool echoLevelPhaseInversion = 9;
  optional bool micDirectLevelPhaseInversion = 10;

  optional uint32 minEchoLevel = 11;
  optional uint32 maxEchoLevel = 12;
  optional uint32 stepEchoLevel = 13;
  optional uint32 minMicDirectLevel = 14;
  optional uint32 maxMicDirectLevel = 15;
  optional uint32 stepMicDirectLevel = 16;
  optional uint32 minEchoPredelay = 17;
  optional uint32 maxEchoPredelay = 18;
  optional uint32 stepEchoPredelay = 19;
  optional uint32 minEchoDelayTime = 20;
  optional uint32 maxEchoDelayTime = 21;
  optional uint32 stepEchoDelayTime = 22;
  optional uint32 minEchoRepeat = 23;
  optional uint32 maxEchoRepeat = 24;
  optional uint32 stepEchoRepeat = 25;
  optional uint32 minEchoRightPredelay = 26;
  optional uint32 maxEchoRightPredelay = 27;
  optional uint32 stepEchoRightPredelay = 28;
  optional int32 minEchoRightDelay = 29;
  optional int32 maxEchoRightDelay = 30;
  optional uint32 stepEchoRightDelay = 31;
}

message StereoOutput {
  optional float leftChannelVolume = 1;
  optional float rightChannelVolume = 2;
  optional float leftDelay = 3;
  optional float rightDelay = 4;
  optional bool leftMute = 5;
  optional bool rightMute = 6;

  optional bool leftChannelVolumePhaseInversion = 7;
  optional bool rightChannelVolumePhaseInversion = 8;

  optional float minLeftChannelVolume = 9;
  optional float maxLeftChannelVolume = 10;
  optional float stepLeftChannelVolume = 11;
  optional float minRightChannelVolume = 12;
  optional float maxRightChannelVolume = 13;
  optional float stepRightChannelVolume = 14;
  optional float minLeftDelay = 15;
  optional float maxLeftDelay = 16;
  optional float stepLeftDelay = 17;
  optional float minRightDelay = 18;
  optional float maxRightDelay = 19;
  optional float stepRightDelay = 20;
}

message MonoOutput {
  optional float volume = 1;
  optional float delay = 2;
  optional bool mute = 3;

  optional bool volumePhaseInversion = 4;

  optional float minVolume = 5;
  optional float maxVolume = 6;
  optional float stepVolume = 7;
  optional float minDelay = 8;
  optional float maxDelay = 9;
  optional float stepDelay = 10;
}

message Mixer {
  optional uint32 micDirectLevel = 1;
  optional uint32 musicLevel = 2;
  optional uint32 reverbLevel = 3;
  optional uint32 echoLevel = 4;

  optional bool micDirectLevelPhaseInversion = 5;
  optional bool musicLevelPhaseInversion = 6;
  optional bool reverbLevelPhaseInversion = 7;
  optional bool echoLevelPhaseInversion = 8;

  optional uint32 minMicDirectLevel = 9;
  optional uint32 maxMicDirectLevel = 10;
  optional uint32 stepMicDirectLevel = 11;
  optional uint32 minMusicLevel = 12;
  optional uint32 maxMusicLevel = 13;
  optional uint32 stepMusicLevel = 14;
  optional uint32 minReverbLevel = 15;
  optional uint32 maxReverbLevel = 16;
  optional uint32 stepReverbLevel = 17;
  optional uint32 minEchoLevel = 18;
  optional uint32 maxEchoLevel = 19;
  optional uint32 stepEchoLevel = 20;
}

message MainOutputDb {
  optional Eq eq = 1;
  optional StereoOutput output = 2;
  optional Mixer mixer = 3;
  optional Compressor compressor = 4;
}

message SubOutputDb {
  optional Eq eq = 1;
  optional MonoOutput output = 2;
  optional Mixer mixer = 3;
  optional Compressor compressor = 4;
}

message CenterDb {
  optional Eq eq = 1;
  optional MonoOutput output = 2;
  optional Mixer mixer = 3;
  optional Compressor compressor = 4;
}

message SurroundDb {
  optional Eq eq = 1;
  optional StereoOutput output = 2;
  optional Mixer mixer = 3;
  optional Compressor compressor = 4;
}

message DeviceDb {
  optional SystemDb system = 1;
  optional MusicDb music = 2;
  optional MicDb mic = 3;
  optional ReverbDb reverb = 4;
  optional EchoDb echo = 5;
  optional MainOutputDb mainOutput = 6;
  optional SubOutputDb subOutput = 7;
  optional CenterDb center = 8;
  optional SurroundDb surround = 9;
}

message GetDbRequest {
  optional DbSection section = 1;
}

message GetDbResponse {
  optional string deviceId = 1;
  optional string firmwareVersion = 2;
  optional DbSection section = 3;

  oneof payload {
    SystemDb system = 4;
    MusicDb music = 5;
    MicDb mic = 6;
    ReverbDb reverb = 7;
    EchoDb echo = 8;
    MainOutputDb mainOutput = 9;
    SubOutputDb subOutput = 10;
    CenterDb center = 11;
    SurroundDb surround = 12;
  }
}

message DeviceConfig {
  optional string deviceId = 1;
  optional string firmwareVersion = 2;
  optional DeviceDb db = 3;
}

// ======== Patch requests (Set*) ========

message EqPointPatch {
  optional uint32 index = 1;
  optional FilterType type = 2;
  optional uint32 freq = 3; // Hz
  optional float gain = 4;
  optional float q = 5;
}

message EqPatch {
  optional EqTarget target = 1;
  optional bool bypass = 2;
  repeated EqPointPatch point = 3;
}

message SetEqRequest {
  repeated EqPatch eq = 1;
}

message NoiseGatePatch {
  optional float gate = 1;
  optional uint32 frameTime = 2;
  optional uint32 atkTime = 3;
  optional uint32 relTime = 4;
}

message CompressorPatch {
  optional float threshold = 1;
  optional uint32 ratio = 2;
  optional uint32 attack = 3;
  optional uint32 release = 4;
  optional bool bypass = 5;
}

message StereoOutputPatch {
  optional float leftChannelVolume = 1;
  optional float rightChannelVolume = 2;
  optional float leftDelay = 3;
  optional float rightDelay = 4;
  optional bool leftMute = 5;
  optional bool rightMute = 6;

  optional bool leftChannelVolumePhaseInversion = 7;
  optional bool rightChannelVolumePhaseInversion = 8;
}

message MonoOutputPatch {
  optional float volume = 1;
  optional float delay = 2;
  optional bool mute = 3;

  optional bool volumePhaseInversion = 4;
}

message MixerPatch {
  optional uint32 micDirectLevel = 1;
  optional uint32 musicLevel = 2;
  optional uint32 reverbLevel = 3;
  optional uint32 echoLevel = 4;

  optional bool micDirectLevelPhaseInversion = 5;
  optional bool musicLevelPhaseInversion = 6;
  optional bool reverbLevelPhaseInversion = 7;
  optional bool echoLevelPhaseInversion = 8;
}

message SetSystemRequest {
  optional string bleName = 1;
  optional bool panelLock = 2;
  optional bool mute = 3;

  optional uint32 musicMaxVolume = 4;
  optional uint32 micMaxVolume = 5;
  optional uint32 effectMaxVolume = 6;

  optional uint32 musicDefaultVolume = 7;
  optional uint32 micDefaultVolume = 8;
  optional uint32 effectDefaultVolume = 9;

  optional bool useDefaultVolume = 10;
  optional uint32 currentModeIndex = 11;

  optional uint32 musicVolume = 12;
  optional uint32 micVolume = 13;
  optional uint32 effectVolume = 14;

  repeated string modeList = 15;
}

message SetMusicRequest {
  optional int32 inputGain = 1;
  optional int32 btGain = 2;
  optional int32 udiskGain = 3;
  optional float musicPitch = 4;
  optional InputSelect inputSelect = 5;

  optional float bass = 6;
  optional float mid = 7;
  optional uint32 midFreq = 8; // Hz
  optional float treble = 9;

  optional NoiseGatePatch noise = 10;
}

message SetMicRequest {
  optional bool micEqJointDebugging = 1;
  optional uint32 micAVolume = 2;
  optional uint32 micBVolume = 3;
  optional FbxMode micFBX = 4;

  optional float bass = 5;
  optional float mid = 6;
  optional uint32 midFreq = 7; // Hz
  optional float treble = 8;

  optional NoiseGatePatch noise = 9;
  optional CompressorPatch compressor = 10;
}

message SetReverbRequest {
  optional uint32 reverbLevel = 1;
  optional uint32 micDirectLevel = 2;
  optional uint32 reverbPredelay = 3;
  optional uint32 reverbDecay = 4;

  optional bool reverbLevelPhaseInversion = 5;
  optional bool micDirectLevelPhaseInversion = 6;
}

message SetEchoRequest {
  optional uint32 echoLevel = 1;
  optional uint32 micDirectLevel = 2;
  optional uint32 echoPredelay = 3;
  optional uint32 echoDelayTime = 4;
  optional uint32 echoRepeat = 5;
  optional uint32 echoRightPredelay = 6;
  optional int32 echoRightDelay = 7;

  optional bool echoLevelPhaseInversion = 8;
  optional bool micDirectLevelPhaseInversion = 9;
}

message SetMainOutputRequest {
  optional StereoOutputPatch output = 1;
  optional MixerPatch mixer = 2;
  optional CompressorPatch compressor = 3;
}

message SetSubOutputRequest {
  optional MonoOutputPatch output = 1;
  optional MixerPatch mixer = 2;
  optional CompressorPatch compressor = 3;
}

// Protocol.md currently has no dedicated msg_id for these, but the DB contains these sections.
message SetCenterRequest {
  optional MonoOutputPatch output = 1;
  optional MixerPatch mixer = 2;
  optional CompressorPatch compressor = 3;
}

message SetSurroundRequest {
  optional StereoOutputPatch output = 1;
  optional MixerPatch mixer = 2;
  optional CompressorPatch compressor = 3;
}

message SwitchCurrentModeRequest {
  optional uint32 currentModeIndex = 1;
}

message SwitchCurrentModeResponse {
  optional uint32 currentModeIndex = 1;
}

message SaveModeRequest {
  optional uint32 currentModeIndex = 1;
}

message ResetEqRequest {
  optional EqTarget target = 1;
  repeated uint32 index = 2; // empty = reset all points
}
