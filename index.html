<body style="background: black; color: white">
  <noscript>
    <div style="padding: 20px; text-align: center; background: #000; color: #fff;">
      <h1>JavaScript Required</h1>
      <p>We're sorry, but WebHMI requires JavaScript to function. Please enable it in your browser settings to proceed.
      </p>
    </div>
  </noscript>
  <div id="root">
    <!-- Initial Loading State -->
    <style>
      .initial-loader-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #000000;
        color: #ffffff;
        z-index: 9999;
        font-family: system-ui, -apple-system, sans-serif;
      }

      .loader-spinner {
        width: 48px;
        height: 48px;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }

      .loader-text {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.05em;
        opacity: 0.8;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="initial-loader-container">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="loader-spinner">
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </svg>
      <div class="loader-text">Initializing WebHMI...</div>
    </div>
  </div>
